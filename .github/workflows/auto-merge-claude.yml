name: Auto-merge Claude Code branches

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Branch: $BRANCH"

          # No-op when branch is already on main (e.g. local FF-merge then push)
          if [ -z "$(git rev-list origin/main..HEAD)" ]; then
            echo "Branch has no commits ahead of main — already merged. Nothing to do."
            exit 0
          fi

          TITLE=$(git log -1 --format='%s')

          PR_OUTPUT=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "Auto-created from Claude Code mobile branch \`$BRANCH\`" \
            2>&1) || PR_EXIT=$?

          if echo "$PR_OUTPUT" | grep -q "already exists"; then
            PR_URL=$(gh pr view "$BRANCH" --json url -q '.url')
          elif [ -n "${PR_EXIT:-}" ]; then
            echo "PR creation failed:"
            echo "$PR_OUTPUT"
            exit 1
          else
            PR_URL="$PR_OUTPUT"
          fi

          echo "PR: $PR_URL"

          gh pr merge "$BRANCH" --merge --auto
