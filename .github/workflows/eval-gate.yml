# Eval Report — report trigger + behavioral eval results on every PR and on
# every push to main that changes package.json (i.e. before publish).
#
# IMPORTANT: this workflow is REPORTING, not gating. It runs with
# --fail-on none so a failing eval never blocks merge or the publish workflow.
# Severity bands and per-expectation results are surfaced in the Job Summary
# and uploaded as artifacts. The maintainer decides whether to act on a
# regression before merging / publishing.
#
# Severity bands and scoring logic live in evals/compute_eval_score.py.
#
# AUTH MODEL — subscription token only (no API key, no marginal cost):
#   - Local: developers run the same scripts with `claude` CLI authenticated
#     via Claude Pro/Max OAuth (`claude login`).
#   - CI: requires a long-lived subscription token. One-time setup:
#       1. Local: `claude setup-token` (requires an active Claude subscription)
#       2. Copy the printed token into repo Settings → Secrets and variables →
#          Actions → New secret named `CLAUDE_CODE_OAUTH_TOKEN`
#     If the secret is NOT set, the preflight job skips trigger-eval and
#     behavioral-eval cleanly (gray ⏭️) instead of producing a misleading
#     red ❌. Repo can therefore live happily in local-only mode; add the
#     secret later to flip on CI reporting.
#   - ANTHROPIC_API_KEY is intentionally not consulted — the project's policy
#     is to use only subscription credentials so eval runs incur no marginal
#     billing.
#
# Runtime expectation when enabled: trigger eval is ~5–15 min and behavioral
# eval is ~10–40 min. CI uses --runs 1 to keep cost low; local runs default
# to --runs 3 for majority voting.

name: Eval Report

on:
  pull_request:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      have_token: ${{ steps.check.outputs.have_token }}
    steps:
      - name: Check for CLAUDE_CODE_OAUTH_TOKEN
        id: check
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "have_token=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN found — eval jobs will run on subscription"
          else
            echo "have_token=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Eval Report — skipped"
              echo ""
              echo "\`CLAUDE_CODE_OAUTH_TOKEN\` secret is not set on this repo, so CI eval is in **local-only mode**."
              echo ""
              echo "To enable automated reporting (no API key, no marginal billing — uses your Claude subscription):"
              echo "1. Locally: \`claude setup-token\` (requires an active Claude Pro/Max subscription)"
              echo "2. Copy the printed token into **Settings → Secrets and variables → Actions** as \`CLAUDE_CODE_OAUTH_TOKEN\`"
              echo ""
              echo "Until then, run evals locally with your Claude Pro/Max subscription:"
              echo "\`\`\`bash"
              echo "claude login   # one-time OAuth"
              echo "python3 evals/run_trigger_test.py --runs 3 --fail-on critical"
              echo "python3 evals/run_behavioral_eval.py --runs 3 --fail-on critical"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set — skipping eval jobs (local-only mode). See job summary for how to enable."
          fi

  trigger-eval:
    needs: preflight
    if: needs.preflight.outputs.have_token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install this branch's skill at user level
        run: |
          mkdir -p "$HOME/.claude/skills/product-playbook"
          cp -r ./. "$HOME/.claude/skills/product-playbook/"
          # Also register sub-agents at the user level so `claude -p`
          # subprocesses can dispatch to them via Task tool. Without this
          # step, dispatch-related eval expectations cannot pass —
          # subagents bundled inside the skill dir are not discovered by
          # headless claude sessions.
          mkdir -p "$HOME/.claude/agents"
          cp ./agents/*.md "$HOME/.claude/agents/" 2>/dev/null || true
          ls "$HOME/.claude/skills/product-playbook" | head -20
          echo "Registered agents:" && ls "$HOME/.claude/agents"

      - name: Run trigger eval (reporting only, never blocks)
        working-directory: evals
        run: |
          python3 run_trigger_test.py \
            --runs 1 \
            --workers 2 \
            --fail-on none \
            --json eval-results.trigger.json \
            --markdown eval-results.trigger.md

      - name: Write trigger summary to job summary
        if: always()
        working-directory: evals
        run: |
          if [ -f eval-results.trigger.md ]; then
            cat eval-results.trigger.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload trigger results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigger-eval-results
          path: |
            evals/eval-results.trigger.json
            evals/eval-results.trigger.md

  behavioral-eval:
    needs: preflight
    if: needs.preflight.outputs.have_token == 'true'
    runs-on: ubuntu-latest
    # Absolute worst case = 12 evals / --workers 2 × (600s response + 240s
    # judge + 240s judge repair) ≈ 108 min. 120 gives ~10 min headroom for
    # setup, unit tests, and artifact upload. Realistic runs finish in
    # 30–40 min; this ceiling exists to avoid silent cancellation in the
    # rare case where many evals stack into the timeout path simultaneously.
    timeout-minutes: 120
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install this branch's skill at user level
        run: |
          mkdir -p "$HOME/.claude/skills/product-playbook"
          cp -r ./. "$HOME/.claude/skills/product-playbook/"
          # Register sub-agents at the user level so `claude -p` headless
          # subprocesses can dispatch to them via the Task tool. See the
          # trigger-eval install step for full rationale.
          mkdir -p "$HOME/.claude/agents"
          cp ./agents/*.md "$HOME/.claude/agents/" 2>/dev/null || true

      - name: Register specialist-dispatch hook at user level
        # `claude -p` headless mode loads UserPromptSubmit hooks from
        # ~/.claude/settings.json but does NOT load plugin hooks. Without
        # this step, eval 10 (discovery) and 11 (strategy-critic) cannot
        # trigger the dispatch reminder, so the orchestrator inline-runs
        # the analysis and the dispatch marker is missing from the response.
        # Smoke-tested locally 2026-05-27: hook fires correctly in -p mode.
        run: |
          python3 - <<'PY'
          import json, pathlib
          settings_path = pathlib.Path.home() / ".claude" / "settings.json"
          hook_path = pathlib.Path.cwd() / "hooks" / "user-prompt-detect-specialist-dispatch.py"
          assert hook_path.exists(), f"Hook script missing: {hook_path}"

          data = json.loads(settings_path.read_text()) if settings_path.exists() else {}
          hooks = data.setdefault("hooks", {})
          ups = hooks.setdefault("UserPromptSubmit", [])
          ups.append({
              "matcher": "",
              "hooks": [{
                  "type": "command",
                  "command": f"python3 {hook_path}",
                  "timeout": 5,
              }],
          })
          settings_path.parent.mkdir(parents=True, exist_ok=True)
          settings_path.write_text(json.dumps(data, indent=2))
          print(f"Registered specialist-dispatch hook → {hook_path}")
          PY

      - name: Run scoring unit tests
        working-directory: evals
        run: python3 -m unittest test_compute_eval_score.py -v

      - name: Run behavioral eval (reporting only, runs=1 in CI)
        working-directory: evals
        run: |
          python3 run_behavioral_eval.py \
            --runs 1 \
            --workers 2 \
            --response-timeout 600 \
            --judge-timeout 240 \
            --fail-on none \
            --json eval-results.behavioral.json \
            --markdown eval-results.behavioral.md

      - name: Write behavioral summary to job summary
        if: always()
        working-directory: evals
        run: |
          if [ -f eval-results.behavioral.md ]; then
            cat eval-results.behavioral.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload behavioral results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-eval-results
          path: |
            evals/eval-results.behavioral.json
            evals/eval-results.behavioral.md
