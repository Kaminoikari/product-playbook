# Eval Report — report trigger + behavioral eval results on every PR and on
# every push to main that changes package.json (i.e. before publish).
#
# IMPORTANT: this workflow is REPORTING, not gating. It runs with
# --fail-on none so a failing eval never blocks merge or the publish workflow.
# Severity bands and per-expectation results are surfaced in the Job Summary
# and uploaded as artifacts. The maintainer decides whether to act on a
# regression before merging / publishing.
#
# Severity bands and scoring logic live in evals/compute_eval_score.py.
#
# AUTH MODEL:
#   - Local: developers run the same scripts with `claude` CLI authenticated
#     via Claude Pro/Max OAuth (`claude login`). No API key required and no
#     marginal cost beyond the subscription.
#   - CI: GitHub Actions cannot use OAuth in a headless container, so the
#     `ANTHROPIC_API_KEY` secret is required to run eval here. If the secret
#     is NOT set, the preflight job skips trigger-eval and behavioral-eval
#     cleanly (gray ⏭️) instead of producing a misleading red ❌. Repo can
#     therefore live happily in free local-only mode; add the secret later
#     to flip on CI reporting.
#
# Runtime expectation when enabled: trigger eval is ~5–15 min and behavioral
# eval is ~10–40 min. CI uses --runs 1 to keep cost low; local runs default
# to --runs 3 for majority voting.

name: Eval Report

on:
  pull_request:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      have_key: ${{ steps.check.outputs.have_key }}
    steps:
      - name: Check for ANTHROPIC_API_KEY
        id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY found — eval jobs will run"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Eval Report — skipped"
              echo ""
              echo "\`ANTHROPIC_API_KEY\` secret is not set on this repo, so CI eval is in **free local-only mode**."
              echo ""
              echo "To enable automated reporting:"
              echo "1. Get a key at <https://console.anthropic.com/>"
              echo "2. Add it under **Settings → Secrets and variables → Actions** as \`ANTHROPIC_API_KEY\`"
              echo ""
              echo "Until then, run evals locally with your Claude Pro/Max subscription:"
              echo "\`\`\`bash"
              echo "claude login   # one-time OAuth"
              echo "python3 evals/run_trigger_test.py --runs 3 --fail-on critical"
              echo "python3 evals/run_behavioral_eval.py --runs 3 --fail-on critical"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::ANTHROPIC_API_KEY not set — skipping eval jobs (free local-only mode). See job summary for how to enable."
          fi

  trigger-eval:
    needs: preflight
    if: needs.preflight.outputs.have_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install this branch's skill at user level
        run: |
          mkdir -p "$HOME/.claude/skills/product-playbook"
          cp -r ./. "$HOME/.claude/skills/product-playbook/"
          # Also register sub-agents at the user level so `claude -p`
          # subprocesses can dispatch to them via Task tool. Without this
          # step, dispatch-related eval expectations cannot pass —
          # subagents bundled inside the skill dir are not discovered by
          # headless claude sessions.
          mkdir -p "$HOME/.claude/agents"
          cp ./agents/*.md "$HOME/.claude/agents/" 2>/dev/null || true
          ls "$HOME/.claude/skills/product-playbook" | head -20
          echo "Registered agents:" && ls "$HOME/.claude/agents"

      - name: Run trigger eval (reporting only, never blocks)
        working-directory: evals
        run: |
          python3 run_trigger_test.py \
            --runs 1 \
            --workers 2 \
            --fail-on none \
            --json eval-results.trigger.json \
            --markdown eval-results.trigger.md

      - name: Write trigger summary to job summary
        if: always()
        working-directory: evals
        run: |
          if [ -f eval-results.trigger.md ]; then
            cat eval-results.trigger.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload trigger results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigger-eval-results
          path: |
            evals/eval-results.trigger.json
            evals/eval-results.trigger.md

  behavioral-eval:
    needs: preflight
    if: needs.preflight.outputs.have_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install this branch's skill at user level
        run: |
          mkdir -p "$HOME/.claude/skills/product-playbook"
          cp -r ./. "$HOME/.claude/skills/product-playbook/"
          # Register sub-agents at the user level so `claude -p` headless
          # subprocesses can dispatch to them via the Task tool. See the
          # trigger-eval install step for full rationale.
          mkdir -p "$HOME/.claude/agents"
          cp ./agents/*.md "$HOME/.claude/agents/" 2>/dev/null || true

      - name: Run scoring unit tests
        working-directory: evals
        run: python3 -m unittest test_compute_eval_score.py -v

      - name: Run behavioral eval (reporting only, runs=1 in CI)
        working-directory: evals
        run: |
          python3 run_behavioral_eval.py \
            --runs 1 \
            --workers 2 \
            --fail-on none \
            --json eval-results.behavioral.json \
            --markdown eval-results.behavioral.md

      - name: Write behavioral summary to job summary
        if: always()
        working-directory: evals
        run: |
          if [ -f eval-results.behavioral.md ]; then
            cat eval-results.behavioral.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload behavioral results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-eval-results
          path: |
            evals/eval-results.behavioral.json
            evals/eval-results.behavioral.md
