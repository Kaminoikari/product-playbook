# Eval Debt Check — runs the deterministic debt-report (no LLM, no eval run)
# when references/, agents/, or skills/ change in a PR. Predicts whether
# this PR is likely to change the eval debt picture by comparing the debt
# report at base vs head.
#
# This workflow is safe to auto-fire because it consumes ZERO Claude quota:
#   - it does NOT run any eval
#   - it only runs `scripts/eval-debt-report.py`, which is pure Python
#     reading the existing eval-results.behavioral.json
#
# Distinct from eval-gate.yml (manual-only, burns subscription tokens) and
# i18n-drift-check.yml (deterministic, already in place). See the no-CI-auto-eval
# feedback memory for why all real eval runs stay manual.

name: Eval Debt Check

on:
  pull_request:
    paths:
      - 'references/**'
      - 'agents/**'
      - 'skills/**'
      - 'scripts/eval-debt-report.py'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  debt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check EVAL_ATTRIBUTION paths against the PR's file tree (A1)
        id: attribution
        run: |
          # If a primary/secondary path in EVAL_ATTRIBUTION points at a file
          # the PR removed or renamed, debt-report exits 2 here. That's the
          # signal we need — surface it as the first comment, before bothering
          # with the score-delta calculation.
          set +e
          python3 scripts/eval-debt-report.py --stdout > /dev/null 2>attribution.err
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Report attribution drift (if any)
        if: steps.attribution.outputs.exit_code == '2' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          MARKER="<!-- debt-check-attribution-bot -->"
          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/issues/comments/{}"
          {
            echo "${MARKER}"
            echo "## 🔴 EVAL_ATTRIBUTION points at nonexistent file(s)"
            echo ""
            echo "This PR appears to have renamed or removed a file that"
            echo "\`scripts/eval-debt-report.py\` lists in \`EVAL_ATTRIBUTION\`."
            echo "Update the mapping in that file before merging, or the"
            echo "patch-proposer will target a file that doesn't exist."
            echo ""
            echo "<details><summary>Detector output</summary>"
            echo ""
            echo '```'
            cat attribution.err
            echo '```'
            echo ""
            echo "</details>"
          } > attribution-comment.md
          gh pr comment "${PR_NUMBER}" --body-file attribution-comment.md

      - name: Generate debt report at HEAD
        if: steps.attribution.outputs.exit_code != '2'
        id: debt_head
        run: |
          # debt-report needs an eval-results JSON. If the repo doesn't ship
          # one (typical — eval results live in branches), fall back to a
          # diff-based static prediction (M5).
          if [ ! -f "evals/eval-results.behavioral.json" ]; then
            echo "no_eval=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/eval-debt-report.py --output debt-head.md

      - name: Diff-based debt prediction (M5, when no baseline available)
        if: steps.debt_head.outputs.no_eval == 'true' && github.event_name == 'pull_request'
        id: debt_diff
        run: |
          # Static prediction: for each file in the PR diff under references/,
          # agents/, skills/, look up which evals EVAL_ATTRIBUTION lists it
          # under primary. Print "this PR likely affects evals: [...]".
          # Pure Python; no LLM, no eval run.
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
                    -- 'references/**' 'agents/**' 'skills/**' || true)
          if [ -z "$CHANGED" ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<PYEOF > debt-prediction.md
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('m', 'scripts/eval-debt-report.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          changed = """$CHANGED""".strip().splitlines()
          impact: dict[str, list[str]] = {}
          for eval_name, entry in m.EVAL_ATTRIBUTION.items():
              hits = [c for c in changed if c in entry.get('primary', [])]
              if hits:
                  impact.setdefault(eval_name, []).extend(hits)
          print(f"## Diff-Based Debt Prediction\n")
          print(f"This PR touches {len(changed)} attributed file(s); no baseline eval is")
          print(f"available in the branch, so this is a static prediction based on")
          print(f"\`EVAL_ATTRIBUTION\` primary mappings.\n")
          if not impact:
              print("✅ **No mapped evals** affected — changed files aren't in any")
              print("\`primary\` list. Either the change is unscoped, or EVAL_ATTRIBUTION")
              print("is missing coverage for these files.\n")
          else:
              print(f"⚠️  **{len(impact)} eval(s) likely affected** by this PR:\n")
              for ev, files in sorted(impact.items()):
                  print(f"- \`{ev}\` ← {files}")
              print(f"\nRun \`npm run eval:behavioral\` locally before merging if any are critical.")
          PYEOF

      - name: Job Summary
        if: always()
        run: |
          {
            echo "## Eval Debt Check"
            echo ""
            if [ "${{ steps.attribution.outputs.exit_code }}" = "2" ]; then
              echo "🔴 **EVAL_ATTRIBUTION references a file this PR removed/renamed.** See PR comment above."
            elif [ "${{ steps.debt_head.outputs.no_eval }}" = "true" ]; then
              echo "ℹ️  No baseline eval in this branch. Using diff-based static prediction (M5):"
              echo ""
              if [ -f debt-prediction.md ]; then
                cat debt-prediction.md
              else
                echo "(no PR-side files changed under tracked dirs)"
              fi
            else
              echo "✅ Debt report generated successfully — see artifact for details."
              echo ""
              echo "<details><summary>Debt report (head)</summary>"
              echo ""
              cat debt-head.md
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debt report artifact
        if: always() && steps.debt_head.outputs.no_eval != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eval-debt-report
          path: debt-head.md
          if-no-files-found: ignore
