name: Release on version bump

on:
  push:
    branches: [main]
    paths: [package.json]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "New version detected: $TAG"
          fi

      - name: Create tag
        if: steps.version.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --latest

      # Claude.ai Custom Skills cap uploads at 30MB. The plain GitHub
      # "Download ZIP" of this repo is ~70MB because of demo GIFs in
      # assets/. Ship a trimmed bundle (~900KB) so the README's
      # "Upload to Claude.ai" path actually works.
      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 20

      - name: Build Claude.ai upload bundle
        if: steps.version.outputs.exists == 'false'
        run: bash scripts/build-claude-ai-bundle.sh

      - name: Attach Claude.ai bundle to release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "product-playbook-claude-ai-${{ steps.version.outputs.tag }}.zip" \
            --clobber
